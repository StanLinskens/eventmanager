<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventManager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Workshops manager</h1>
        </div>

        <!-- Authentication Panel -->
        <div class="auth-panel" id="authPanel">
            <h2>Welkom bij WorkshopManager</h2>
            <p style="margin-bottom: 20px;">Kies uw rol om verder te gaan:</p>
            <div class="auth-buttons">
                <button class="role-button" onclick="eventManager.selectRole('student')">
                    👨‍🎓 Student
                </button>
                <button class="role-button" onclick="eventManager.selectRole('admin')">
                    👨‍💼 Administrator
                </button>
            </div>
            <div class="admin-login" id="adminLogin">
                <h3>Administrator Login</h3>
                <div style="margin-top: 15px;">
                    <input type="text" id="adminUsername" placeholder="Gebruikersnaam" style="margin-bottom: 10px;">
                    <input type="password" id="adminPassword" placeholder="Wachtwoord" style="margin-bottom: 10px;">
                    <button onclick="eventManager.adminLogin()">Inloggen</button>
                </div>
            </div>
        </div>

        <!-- User Info Panel -->
        <div class="user-info" id="userInfo" style="display: none;">
            <div>
                <strong id="userRole"></strong>
                <span id="userName"></span>
            </div>
            <button class="logout-btn" onclick="eventManager.logout()">Uitloggen</button>
        </div>

        <!-- Admin Panel -->
        <div class="admin-panel" id="adminPanel">
            <h2>🎯 Workshop Beheer</h2>
            <form id="eventForm">
                <div class="form-row">
                    <div>
                        <label for="eventName">Workshop Naam:</label>
                        <input type="text" id="eventName" required>
                    </div>
                    <div>
                        <label for="eventDescription">Beschrijving:</label>
                        <textarea id="eventDescription" rows="2"></textarea>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label for="workshopLeader">Workshop Leider:</label>
                        <input type="text" id="workshopLeader" required>
                    </div>
                    <div>
                        <label for="location">Locatie:</label>
                        <input type="text" id="location">
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label for="startTime">Starttijd:</label>
                        <input type="datetime-local" id="startTime" required>
                    </div>
                    <div>
                        <label for="endTime">Eindtijd:</label>
                        <input type="datetime-local" id="endTime" required>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label>Rondes (tijdsloten):</label>
                        <div class="rounds-checkboxes">
                            <div class="round-row">
                                <label><input type="checkbox" class="roundCheckbox" value="1"> Ronde 1</label>
                                <input type="time" class="roundTime" data-round="1" id="round1Time" title="Tijd voor Ronde 1">
                            </div>
                            <div class="round-row">
                                <label><input type="checkbox" class="roundCheckbox" value="2"> Ronde 2</label>
                                <input type="time" class="roundTime" data-round="2" id="round2Time" title="Tijd voor Ronde 2">
                            </div>
                            <div class="round-row">
                                <label><input type="checkbox" class="roundCheckbox" value="3"> Ronde 3</label>
                                <input type="time" class="roundTime" data-round="3" id="round3Time" title="Tijd voor Ronde 3">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label for="maxParticipants">Maximum Deelnemers:</label>
                        <input type="number" id="maxParticipants" min="1" max="100" value="20" required>
                    </div>
                </div>
                <button type="submit">📅 Workshop Toevoegen</button>
                <button type="button" id="clearEvents">🗑️ Alle Workshops Wissen</button>
                <button type="button" class="export-btn" onclick="eventManager.exportToCSV()">📊 Export CSV</button>
                <button type="button" class="export-btn" onclick="eventManager.exportToExcel()">📊 Export Excel</button>
            </form>
        </div>

        <!-- Registration Form -->
        <div class="registration-form" id="registrationForm">
            <h2>📋 Aanmelden voor Workshop</h2>
            <form id="studentRegistrationForm">
                <div class="form-row">
                    <div>
                        <label for="participantName">Volledige Naam:</label>
                        <input type="text" id="participantName" required>
                    </div>
                    <div>
                        <label for="participantEmail">Email Adres:</label>
                        <!-- Require address like 12345@roc-teraa.nl or 12345@ter-aa.nl -->
                            <!-- Accept either 'roc-teraa.nl' or 'ter-aa.nl' with a numeric local part -->
                            <input type="email" id="participantEmail" required pattern="^[0-9]+@(?:roc-teraa|ter-aa)\\.nl$" title="Gebruik je Ter AA e-mailadres: 12345@roc-teraa.nl of 12345@ter-aa.nl">
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label for="studentNumber">Leerlingnummer:</label>
                        <input type="number" id="studentNumber" min="1" required>
                    </div>
                    <div>
                        <label for="studentProgram">Opleiding:</label>
                        <input type="text" id="studentProgram" required>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label for="eventSelect">Selecteer Ronde 1:</label>
                        <select id="eventSelect" required>
                            <option value="">-- Kies een ronde --</option>
                        </select>

                        <label for="eventSelect2">Selecteer Ronde 2:</label>
                        <select id="eventSelect2" required>
                            <option value="">-- Kies een ronde --</option>
                        </select>

                        <label for="eventSelect3">Selecteer ronde 3:</label>
                        <select id="eventSelect3" required>
                            <option value="">-- Kies een ronde --</option>
                        </select>
                    </div>
                </div>
                <button id="registerBtn" type="submit">
                    ✅ Aanmelden
                </button>
            </form>
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </div>

        <!-- Events Display -->
        <div class="events-grid" id="eventsGrid">
            <!-- Events will be populated here -->
        </div>

        <!-- Statistics -->
        <div class="statistics" id="statisticsPanel">
            <h2>📊 Statistieken</h2>
            <div class="stats-grid" id="statsGrid">
                <!-- Stats will be populated here -->
            </div>
        </div>
    </div>
</body>
</html>
<script src="main.js"></script>
