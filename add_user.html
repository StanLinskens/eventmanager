<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Add Admin User</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 1rem; }
    form { max-width: 400px; }
    label { display:block; margin-top: .5rem }
    input[type=text], input[type=password] { width:100%; padding:.5rem; }
    button { margin-top: .75rem; padding:.5rem 1rem }
    #msg { margin-top: .75rem }
  </style>
</head>
<body>
  <h1>Add Admin</h1>
  <form id="addForm">
    <label>Username
      <input type="text" id="username" required>
    </label>
    <label>Password
      <input type="password" id="password" required>
    </label>
    <button type="submit">Add User</button>
  </form>
  <div id="msg" role="status"></div>

  <script>
    const form = document.getElementById('addForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        msg.textContent = 'Please provide username and password.';
        return;
      }

      try {
        const res = await fetch('api/add_admin.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const json = await res.json();
        if (res.ok && json.success) {
          msg.style.color = 'green';
          msg.textContent = `User "${json.username}" added.`;
          form.reset();
        } else {
          msg.style.color = 'red';
          msg.textContent = json.message || ('Error: ' + res.statusText);
        }
      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = 'Network or server error: ' + err.message;
      }
    });
  </script>
</body>
</html>
